<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <div class="title-row">
      <h1 class="game-title">TETRIS</h1>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Cambiar a modo claro" title="Cambiar tema" aria-pressed="false">
        <span class="theme-toggle-icon">🌙</span>
      </button>
    </div>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>

      <div id="overlay" class="overlay hidden">
        <div class="overlay-box">
          <p id="overlay-title">GAME OVER</p>
          <p id="overlay-score"></p>
          <div id="overlay-highscore-section" class="highscore-section hidden">
            <p id="overlay-stats" class="highscore-stats"></p>
            <div id="highscore-entry" class="highscore-entry hidden">
              <input id="player-name-input" type="text" maxlength="12" placeholder="Jugador" autocomplete="off" />
              <button id="save-score-btn" type="button">Guardar</button>
            </div>
            <div class="highscore-table-wrap">
              <span class="label">TOP 5</span>
              <table class="highscore-table">
                <thead>
                  <tr><th>#</th><th>Nombre</th><th>Puntos</th><th>Combo</th><th>Líneas</th></tr>
                </thead>
                <tbody id="overlay-highscores"></tbody>
              </table>
            </div>
            <button id="reset-scores-btn" class="secondary-btn" type="button">Resetear records</button>
          </div>
          <button id="restart-btn" type="button">Reiniciar</button>
        </div>
      </div>

      <div id="start-screen" class="overlay hidden">
        <div class="overlay-box">
          <p id="start-title" class="game-title-overlay">TETRIS</p>
          <div class="highscore-table-wrap">
            <span class="label">TOP 5</span>
            <table class="highscore-table">
              <thead>
                <tr><th>#</th><th>Nombre</th><th>Puntos</th><th>Combo</th><th>Líneas</th></tr>
              </thead>
              <tbody id="start-highscores"></tbody>
            </table>
          </div>
          <button id="play-btn" type="button">Jugar</button>
          <button id="reset-scores-start-btn" class="secondary-btn" type="button">Resetear records</button>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
